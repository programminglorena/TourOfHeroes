<h2>{{hero.name | uppercase}} Details</h2>
<div><span>id: </span>{{hero.id}}</div>
<div>
    <label for="name">Hero name:</label>
    <input id="name" [(ngModel)]="hero.name" placeholder="name">
</div>

<!-- [(ngModel)] é a sintaxe de two-way data binding do Angular.
Aqui o ngModel binda a propriedade hero.name para o textbox HTML, assim os dados podem fluir em ambas as direções : da propriedade hero.name para o textbox e do textbox de volta para o hero.name -->
